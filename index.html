<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Realtime Multiplayer Clicker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    #authOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    .auth-box { background: #2a2a2a; padding: 30px; border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; gap: 10px; width: 320px; text-align: center; }
    .auth-box label { font-size: 0.85rem; text-align: left; color: #ccc; }
    .auth-box input[type="text"], .auth-box input[type="email"], .auth-box input[type="password"] { padding: 10px; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; font-size: 1rem; }
    .color-picker-row { display: flex; align-items: center; gap: 10px; }
    .auth-box input[type="color"] { border: none; width: 40px; height: 40px; border-radius: 4px; cursor: pointer; background: none; }
    .auth-box button { padding: 10px; border-radius: 4px; border: none; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 5px; }
    .auth-box button.sec { background: #333; border: 1px solid #555; }
    .auth-box button:hover { opacity: 0.9; }
    #errorMsg { color: #ff5555; font-size: 0.85rem; }
    h1 { margin-bottom: 10px; font-size: 1.2rem; }
    canvas { border: 2px solid #444; background-color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }
  </style>
</head>
<body>

  <div id="authOverlay">
    <div class="auth-box">
      <h2 id="authTitle">Account Login</h2>
      
      <div id="errorMsg"></div>

      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" placeholder="email@example.com" autofocus />

      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" />

      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Player Name" maxlength="12" />

      <label>Avatar Color</label>
      <div class="color-picker-row">
        <input type="color" id="colorInput" value="#4CAF50" />
        <span style="font-size: 0.8rem; color: #aaa;">Pick color</span>
      </div>

      <button id="loginBtn">Log In</button>
      <button id="signupBtn" class="sec">Sign Up</button>
    </div>
  </div>

  <h1>Click your circle to earn points!</h1>
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, update, get, onValue, onDisconnect } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDA3gMEnbJLyRJh5Y-aIgj_fwgLI_44D4k",
      authDomain: "cluster-multiplayer.firebaseapp.com",
      databaseURL: "https://cluster-multiplayer-default-rtdb.firebaseio.com",
      projectId: "cluster-multiplayer",
      storageBucket: "cluster-multiplayer.firebasestorage.app",
      messagingSenderId: "752922691624",
      appId: "1:752922691624:web:7e4a3abf799d7d66f3cd1d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentUser = null;
    let playerRef = null;
    let userProfileRef = null;
    const allPlayersRef = ref(database, 'activePlayers');

    const localPlayer = {
      x: 100 + Math.random() * (canvas.width - 200),
      y: 100 + Math.random() * (canvas.height - 200),
      radius: 35,
      color: "#4CAF50",
      clicks: 0,
      name: "Player"
    };

    let allPlayers = {};
    let isPlaying = false;

    const authOverlay = document.getElementById('authOverlay');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const usernameInput = document.getElementById('usernameInput');
    const colorInput = document.getElementById('colorInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const errorMsg = document.getElementById('errorMsg');

    // Register User
    signupBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const name = usernameInput.value.trim() || "Player";
      const color = colorInput.value;

      try {
        errorMsg.innerText = "";
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // Save persistent profile data (including initial score)
        await set(ref(database, 'users/' + uid), {
          name: name,
          color: color,
          clicks: 0
        });

      } catch (err) {
        errorMsg.innerText = err.message.replace("Firebase: ", "");
      }
    });

    // Log In User
    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        errorMsg.innerText = "";
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errorMsg.innerText = err.message.replace("Firebase: ", "");
      }
    });

    // Session Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        playerRef = ref(database, 'activePlayers/' + user.uid);
        userProfileRef = ref(database, 'users/' + user.uid);

        // Fetch saved profile & saved clicks
        const snapshot = await get(userProfileRef);
        if (snapshot.exists()) {
          const profile = snapshot.val();
          localPlayer.name = profile.name || "Player";
          localPlayer.color = profile.color || "#4CAF50";
          localPlayer.clicks = profile.clicks || 0;
        }

        authOverlay.style.display = 'none';
        isPlaying = true;

        onDisconnect(playerRef).remove();

        // Register in active session map
        set(playerRef, {
          x: localPlayer.x,
          y: localPlayer.y,
          color: localPlayer.color,
          name: localPlayer.name,
          clicks: localPlayer.clicks
        });
      }
    });

    onValue(allPlayersRef, (snapshot) => {
      allPlayers = snapshot.val() || {};
    });

    // Handle Click Detection
    canvas.addEventListener('click', (e) => {
      if (!isPlaying || !currentUser) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Distance formula to check if click is inside player circle
      const dx = clickX - localPlayer.x;
      const dy = clickY - localPlayer.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance <= localPlayer.radius) {
        localPlayer.clicks++;

        // Sync live clicks to active session
        update(playerRef, { clicks: localPlayer.clicks });

        // Save persistent total clicks to user profile
        update(userProfileRef, { clicks: localPlayer.clicks });
      }
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const id in allPlayers) {
        const p = allPlayers[id];

        // Draw Player Circle
        ctx.fillStyle = p.color || '#4CAF50';
        ctx.beginPath();
        ctx.arc(p.x, p.y, localPlayer.radius, 0, Math.PI * 2);
        ctx.fill();

        // White border around circle
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Username
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(p.name || "Player", p.x, p.y - 45);

        // Score display inside circle
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText(p.clicks || 0, p.x, p.y + 5);
      }
    }

    function gameLoop() {
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
