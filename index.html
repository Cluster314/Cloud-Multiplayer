<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Realtime Multiplayer Clicker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: #0d0d0d;
      --panel-border: #222222;
      --text-color: #ffffff;
      --subtext-color: #888888;
      --item-border: #1a1a1a;
      --btn-hover: #1f1f1f;
    }

    [data-theme="light"] {
      --bg-color: #f4f5f7;
      --panel-bg: #ffffff;
      --panel-border: #e1e4e8;
      --text-color: #000000;
      --subtext-color: #666666;
      --item-border: #f0f0f0;
      --btn-hover: #eaeaea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Auth Modal */
    #authOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .auth-box {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 32px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .auth-box label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext-color);
    }

    .auth-box input[type="text"], 
    .auth-box input[type="email"], 
    .auth-box input[type="password"] {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .auth-box input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .auth-box button {
      padding: 12px;
      border-radius: 6px;
      border: none;
      background: #4CAF50;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 6px;
      transition: opacity 0.2s;
    }

    .auth-box button.sec {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-color);
    }

    .auth-box button:hover { opacity: 0.85; }
    #errorMsg { color: #ff4949; font-size: 0.85rem; text-align: center; }

    /* Top Navigation Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--panel-border);
      background: var(--panel-bg);
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .theme-toggle-btn:hover {
      background: var(--btn-hover);
    }

    /* Edge-To-Edge Main Layout */
    .game-container {
      flex: 1;
      display: flex;
      width: 100vw;
    }

    .click-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    #clickBtn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 6px solid var(--panel-bg);
      color: #fff;
      font-size: 2.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      transition: transform 0.05s ease;
      outline: none;
      user-select: none;
    }

    #clickBtn:active {
      transform: scale(0.94);
    }

    .click-hint {
      font-size: 0.85rem;
      color: var(--subtext-color);
      letter-spacing: 0.5px;
    }

    /* Full-Height Right Sidebar */
    .leaderboard-section {
      width: 320px;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .leaderboard-section h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--subtext-color);
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .leaderboard-list {
      list-style: none;
      flex-grow: 1;
      overflow-y: auto;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 8px;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--item-border);
    }

    .leaderboard-item .rank {
      font-weight: bold;
      color: var(--subtext-color);
      margin-right: 8px;
      width: 24px;
      display: inline-block;
    }

    .leaderboard-item .score {
      font-weight: 700;
    }

    .my-rank-banner {
      margin-top: 12px;
      padding: 12px;
      background: var(--bg-color);
      border: 1px dashed var(--panel-border);
      border-radius: 6px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #ffca28;
    }
  </style>
</head>
<body data-theme="dark">

  <div id="authOverlay">
    <div class="auth-box">
      <h2 id="authTitle">Account Login</h2>
      <div id="errorMsg"></div>

      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" placeholder="email@example.com" autofocus />

      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" />

      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Player Name" maxlength="12" />

      <label>Avatar Color</label>
      <div class="color-picker-row">
        <input type="color" id="colorInput" value="#4CAF50" />
        <span style="font-size: 0.8rem; color: var(--subtext-color);">Pick color</span>
      </div>

      <button id="loginBtn">Log In</button>
      <button id="signupBtn" class="sec">Sign Up</button>
    </div>
  </div>

  <header>
    <h1>Multiplayer Clicker</h1>
    <button id="themeToggle" class="theme-toggle-btn">Theme: OLED Dark</button>
  </header>

  <div class="game-container">
    <div class="click-section">
      <button id="clickBtn">0</button>
      <span class="click-hint">CLICK TO SCORE</span>
    </div>

    <div class="leaderboard-section">
      <h2>Top 10 Leaderboard</h2>
      <ol id="leaderboardList" class="leaderboard-list"></ol>
      <div id="myRankDisplay" class="my-rank-banner" style="display: none;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, update, get, onValue } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDA3gMEnbJLyRJh5Y-aIgj_fwgLI_44D4k",
      authDomain: "cluster-multiplayer.firebaseapp.com",
      databaseURL: "https://cluster-multiplayer-default-rtdb.firebaseio.com",
      projectId: "cluster-multiplayer",
      storageBucket: "cluster-multiplayer.firebasestorage.app",
      messagingSenderId: "752922691624",
      appId: "1:752922691624:web:7e4a3abf799d7d66f3cd1d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null;
    let userProfileRef = null;
    const allUsersRef = ref(database, 'users');

    const localPlayer = {
      color: "#4CAF50",
      clicks: 0,
      name: "Player"
    };

    const authOverlay = document.getElementById('authOverlay');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const usernameInput = document.getElementById('usernameInput');
    const colorInput = document.getElementById('colorInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    const clickBtn = document.getElementById('clickBtn');
    const leaderboardList = document.getElementById('leaderboardList');
    const myRankDisplay = document.getElementById('myRankDisplay');

    // Theme Toggle Logic
    const themeToggleBtn = document.getElementById('themeToggle');
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.body.setAttribute('data-theme', 'light');
        themeToggleBtn.innerText = 'Theme: Light';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeToggleBtn.innerText = 'Theme: OLED Dark';
      }
    });

    // Register User
    signupBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const name = usernameInput.value.trim() || "Player";
      const color = colorInput.value;

      try {
        errorMsg.innerText = "";
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        await set(ref(database, 'users/' + uid), {
          name: name,
          color: color,
          clicks: 0
        });
      } catch (err) {
        errorMsg.innerText = err.message.replace("Firebase: ", "");
      }
    });

    // Log In User
    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        errorMsg.innerText = "";
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errorMsg.innerText = err.message.replace("Firebase: ", "");
      }
    });

    // Session Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        userProfileRef = ref(database, 'users/' + user.uid);

        const snapshot = await get(userProfileRef);
        if (snapshot.exists()) {
          const profile = snapshot.val();
          localPlayer.name = profile.name || "Player";
          localPlayer.color = profile.color || "#4CAF50";
          localPlayer.clicks = profile.clicks || 0;
        }

        authOverlay.style.display = 'none';
        clickBtn.style.backgroundColor = localPlayer.color;
        clickBtn.innerText = localPlayer.clicks;
      }
    });

    // Global listener for ALL accounts
    onValue(allUsersRef, (snapshot) => {
      const users = snapshot.val() || {};
      
      const sortedUsers = Object.keys(users).map(id => ({
        id: id,
        name: users[id].name || "Player",
        clicks: users[id].clicks || 0
      })).sort((a, b) => b.clicks - a.clicks);

      leaderboardList.innerHTML = "";
      const top10 = sortedUsers.slice(0, 10);
      let inTop10 = false;

      top10.forEach((player, index) => {
        if (currentUser && player.id === currentUser.uid) {
          inTop10 = true;
        }

        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <span><span class="rank">#${index + 1}</span> ${player.name}</span>
          <span class="score">${player.clicks}</span>
        `;
        leaderboardList.appendChild(li);
      });

      if (currentUser && !inTop10) {
        const myRankIndex = sortedUsers.findIndex(player => player.id === currentUser.uid);
        if (myRankIndex !== -1) {
          myRankDisplay.style.display = 'block';
          myRankDisplay.innerText = `Your Rank: #${myRankIndex + 1} of ${sortedUsers.length}`;
        }
      } else {
        myRankDisplay.style.display = 'none';
      }
    });

    // Handle Click
    clickBtn.addEventListener('click', () => {
      if (!currentUser || !userProfileRef) return;

      localPlayer.clicks++;
      clickBtn.innerText = localPlayer.clicks;

      update(userProfileRef, { clicks: localPlayer.clicks });
    });
  </script>
</body>
</html>
