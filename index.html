<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Realtime Multiplayer Clicker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    #authOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    .auth-box { background: #2a2a2a; padding: 30px; border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; gap: 10px; width: 320px; text-align: center; }
    .auth-box label { font-size: 0.85rem; text-align: left; color: #ccc; }
    .auth-box input[type="text"], .auth-box input[type="email"], .auth-box input[type="password"] { padding: 10px; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; font-size: 1rem; }
    .color-picker-row { display: flex; align-items: center; gap: 10px; }
    .auth-box input[type="color"] { border: none; width: 40px; height: 40px; border-radius: 4px; cursor: pointer; background: none; }
    .auth-box button { padding: 10px; border-radius: 4px; border: none; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 5px; }
    .auth-box button.sec { background: #333; border: 1px solid #555; }
    .auth-box button:hover { opacity: 0.9; }
    #errorMsg { color: #ff5555; font-size: 0.85rem; }

    /* New Layout Styles */
    .game-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: stretch;
      justify-content: center;
      width: 700px;
      height: 400px;
      margin-top: 15px;
    }

    .click-section {
      flex: 1;
      background: #222;
      border: 2px solid #444;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    #clickBtn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #fff;
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: transform 0.05s ease;
    }
    #clickBtn:active {
      transform: scale(0.92);
    }

    .leaderboard-section {
      width: 280px;
      background: #222;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .leaderboard-section h2 {
      font-size: 1.1rem;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
      margin-bottom: 10px;
      text-align: center;
    }

    .leaderboard-list {
      list-style: none;
      flex-grow: 1;
      overflow-y: auto;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 0.85rem;
      border-bottom: 1px solid #333;
    }

    .my-rank-banner {
      margin-top: 10px;
      padding: 8px;
      background: #333;
      border: 1px dashed #666;
      border-radius: 4px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffca28;
    }
  </style>
</head>
<body>

  <div id="authOverlay">
    <div class="auth-box">
      <h2 id="authTitle">Account Login</h2>
      <div id="errorMsg"></div>

      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" placeholder="email@example.com" autofocus />

      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" />

      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Player Name" maxlength="12" />

      <label>Avatar Color</label>
      <div class="color-picker-row">
        <input type="color" id="colorInput" value="#4CAF50" />
        <span style="font-size: 0.8rem; color: #aaa;">Pick color</span>
      </div>

      <button id="loginBtn">Log In</button>
      <button id="signupBtn" class="sec">Sign Up</button>
    </div>
  </div>

  <h1>Multiplayer Clicker</h1>

  <div class="game-container">
    <div class="click-section">
      <button id="clickBtn">0</button>
      <span style="font-size:0.85rem; color:#aaa;">Click to score!</span>
    </div>

    <div class="leaderboard-section">
      <h2>Top 10 Leaderboard</h2>
      <ol id="leaderboardList" class="leaderboard-list"></ol>
      <div id="myRankDisplay" class="my-rank-banner" style="display: none;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, update, get, onValue } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDA3gMEnbJLyRJh5Y-aIgj_fwgLI_44D4k",
      authDomain: "cluster-multiplayer.firebaseapp.com",
      databaseURL: "https://cluster-multiplayer-default-rtdb.firebaseio.com",
      projectId: "cluster-multiplayer",
      storageBucket: "cluster-multiplayer.firebasestorage.app",
      messagingSenderId: "752922691624",
      appId: "1:752922691624:web:7e4a3abf799d7d66f3cd1d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null;
    let userProfileRef = null;
    const allUsersRef = ref(database, 'users');

    const localPlayer = {
      color: "#4CAF50",
      clicks: 0,
      name: "Player"
    };

    const authOverlay = document.getElementById('authOverlay');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const usernameInput = document.getElementById('usernameInput');
    const colorInput = document.getElementById('colorInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    const clickBtn = document.getElementById('clickBtn');
    const leaderboardList = document.getElementById('leaderboardList');
    const myRankDisplay = document.getElementById('myRankDisplay');

    // Register User
    signupBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const name = usernameInput.value.trim() || "Player";
      const color = colorInput.value;

      try {
        errorMsg.innerText = "";
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        await set(ref(database, 'users/' + uid), {
          name: name,
          color: color,
          clicks: 0
        });
      } catch (err) {
        errorMsg.innerText = err.message.replace("Firebase: ", "");
      }
    });

    // Log In User
    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        errorMsg.innerText = "";
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errorMsg.innerText = err.message.replace("Firebase: ", "");
      }
    });

    // Session Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        userProfileRef = ref(database, 'users/' + user.uid);

        const snapshot = await get(userProfileRef);
        if (snapshot.exists()) {
          const profile = snapshot.val();
          localPlayer.name = profile.name || "Player";
          localPlayer.color = profile.color || "#4CAF50";
          localPlayer.clicks = profile.clicks || 0;
        }

        authOverlay.style.display = 'none';
        clickBtn.style.backgroundColor = localPlayer.color;
        clickBtn.innerText = localPlayer.clicks;
      }
    });

    // Global listener for ALL accounts (online & offline)
    onValue(allUsersRef, (snapshot) => {
      const users = snapshot.val() || {};
      
      // Convert to array and sort descending by click count
      const sortedUsers = Object.keys(users).map(id => ({
        id: id,
        name: users[id].name || "Player",
        clicks: users[id].clicks || 0
      })).sort((a, b) => b.clicks - a.clicks);

      // Render Top 10
      leaderboardList.innerHTML = "";
      const top10 = sortedUsers.slice(0, 10);
      let inTop10 = false;

      top10.forEach((player, index) => {
        if (currentUser && player.id === currentUser.uid) {
          inTop10 = true;
        }

        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <span><b>#${index + 1}</b> ${player.name}</span>
          <span><b>${player.clicks}</b></span>
        `;
        leaderboardList.appendChild(li);
      });

      // Show personal rank banner if outside top 10
      if (currentUser && !inTop10) {
        const myRankIndex = sortedUsers.findIndex(player => player.id === currentUser.uid);
        if (myRankIndex !== -1) {
          myRankDisplay.style.display = 'block';
          myRankDisplay.innerText = `Your Rank: #${myRankIndex + 1} of ${sortedUsers.length}`;
        }
      } else {
        myRankDisplay.style.display = 'none';
      }
    });

    // Handle Click
    clickBtn.addEventListener('click', () => {
      if (!currentUser || !userProfileRef) return;

      localPlayer.clicks++;
      clickBtn.innerText = localPlayer.clicks;

      // Update total clicks in global users database
      update(userProfileRef, { clicks: localPlayer.clicks });
    });
  </script>
</body>
</html>
