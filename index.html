<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Realtime Multiplayer Clicker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: rgba(13, 13, 13, 0.75);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text-color: #ffffff;
      --subtext-color: #a0a0a0;
      --item-border: rgba(255, 255, 255, 0.05);
      --btn-hover: rgba(255, 255, 255, 0.08);
      --glow-color: rgba(76, 175, 80, 0.4);
    }

    [data-theme="light"] {
      --bg-color: #f0f2f5;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: rgba(0, 0, 0, 0.08);
      --text-color: #111111;
      --subtext-color: #666666;
      --item-border: rgba(0, 0, 0, 0.04);
      --btn-hover: rgba(0, 0, 0, 0.05);
      --glow-color: rgba(76, 175, 80, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Ambient Background Glows */
    .ambient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.15;
      animation: float 18s infinite alternate ease-in-out;
    }

    .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #4CAF50; }
    .blob-2 { bottom: -10%; right: -10%; width: 45vw; height: 45vw; background: #2196F3; animation-delay: -5s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.1); }
    }

    /* Auth Modal */
    #authOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .auth-box {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 36px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 360px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
    }

    .auth-box h2 {
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-box label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--subtext-color);
    }

    .auth-box input[type="text"], 
    .auth-box input[type="email"], 
    .auth-box input[type="password"] {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .auth-box input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }

    .auth-box button {
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 8px;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
    }

    .auth-box button:active { transform: scale(0.98); }

    .auth-box button.sec {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-color);
      box-shadow: none;
    }

    #errorMsg { color: #ff4949; font-size: 0.85rem; text-align: center; }

    /* Top Navigation Header */
    header {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--panel-border);
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--text-color), var(--subtext-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--btn-hover);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--panel-border);
    }

    .color-picker-wrapper span {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext-color);
    }

    #liveColorPicker {
      -webkit-appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    #liveColorPicker::-webkit-color-swatch-wrapper { padding: 0; }
    #liveColorPicker::-webkit-color-swatch { border: 2px solid var(--panel-bg); border-radius: 50%; }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      transition: background 0.2s;
    }

    .theme-toggle-btn:hover { background: var(--btn-hover); }

    /* Edge-To-Edge Main Layout */
    .game-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      width: 100vw;
    }

    .click-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px;
    }

    #clickBtn {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 8px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 50px var(--glow-color);
      transition: transform 0.05s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      outline: none;
      user-select: none;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    #clickBtn:active {
      transform: scale(0.93);
    }

    .click-hint {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--subtext-color);
    }

    /* Leaderboard Sidebar */
    .leaderboard-section {
      width: 340px;
      background: var(--panel-bg);
      border-left: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .leaderboard-section h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--subtext-color);
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }

    .leaderboard-list {
      list-style: none;
      flex-grow: 1;
      overflow-y: auto;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--item-border);
      border-radius: 8px;
      transition: background 0.15s;
    }

    .leaderboard-item:hover {
      background: var(--btn-hover);
    }

    .leaderboard-item .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .leaderboard-item .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .leaderboard-item .rank {
      font-weight: 800;
      color: var(--subtext-color);
      width: 20px;
    }

    .leaderboard-item .score {
      font-weight: 800;
    }

    .my-rank-banner {
      margin-top: 14px;
      padding: 14px;
      background: rgba(255, 202, 40, 0.08);
      border: 1px dashed rgba(255, 202, 40, 0.4);
      border-radius: 10px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: #ffca28;
    }
  </style>
</head>
<body data-theme="dark">

  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div id="authOverlay">
    <div class="auth-box">
      <h2>Join Game</h2>
      <div id="errorMsg"></div>

      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" placeholder="email@example.com" autofocus />

      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" />

      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="Player Name" maxlength="12" />

      <button id="loginBtn">Log In</button>
      <button id="signupBtn" class="sec">Sign Up</button>
    </div>
  </div>

  <header>
    <h1>Multiplayer Clicker</h1>
    <div class="header-controls">
      <div class="color-picker-wrapper">
        <span>Avatar Color</span>
        <input type="color" id="liveColorPicker" value="#4CAF50" title="Change color anytime" />
      </div>
      <button id="themeToggle" class="theme-toggle-btn">Theme: OLED Dark</button>
    </div>
  </header>

  <div class="game-container">
    <div class="click-section">
      <button id="clickBtn">0</button>
      <span class="click-hint">CLICK TO SCORE</span>
    </div>

    <div class="leaderboard-section">
      <h2>Top 10 Leaderboard</h2>
      <ol id="leaderboardList" class="leaderboard-list"></ol>
      <div id="myRankDisplay" class="my-rank-banner" style="display: none;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, update, get, onValue } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDA3gMEnbJLyRJh5Y-aIgj_fwgLI_44D4k",
      authDomain: "cluster-multiplayer.firebaseapp.com",
      databaseURL: "https://cluster-multiplayer-default-rtdb.firebaseio.com",
      projectId: "cluster-multiplayer",
      storageBucket: "cluster-multiplayer.firebasestorage.app",
      messagingSenderId: "752922691624",
      appId: "1:752922691624:web:7e4a3abf799d7d66f3cd1d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let currentUser = null;
    let userProfileRef = null;
    const allUsersRef = ref(database, 'users');

    const localPlayer = {
      color: "#4CAF50",
      clicks: 0,
      name: "Player"
    };

    const authOverlay = document.getElementById('authOverlay');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const usernameInput = document.getElementById('usernameInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const errorMsg = document.getElementById('errorMsg');
    
    const clickBtn = document.getElementById('clickBtn');
    const liveColorPicker = document.getElementById('liveColorPicker');
    const leaderboardList = document.getElementById('leaderboardList');
    const myRankDisplay = document.getElementById('myRankDisplay');

    // Theme Toggle Logic
    const themeToggleBtn = document.getElementById('themeToggle');
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.body.setAttribute('data-theme', 'light');
        themeToggleBtn.innerText = 'Theme: Light';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeToggleBtn.innerText = 'Theme: OLED Dark';
      }
    });

    // In-Game Dynamic Color Change Listener
    liveColorPicker.addEventListener('input', (e) => {
      const newColor = e.target.value;
      localPlayer.color = newColor;
      
      clickBtn.style.backgroundColor = newColor;
      document.documentElement.style.setProperty('--glow-color', `${newColor}66`);

      if (userProfileRef) {
        update(userProfileRef, { color: newColor });
      }
    });

    // Register User
    signupBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const name = usernameInput.value.trim() || "Player";
      const initialColor = liveColorPicker.value;

      try {
        errorMsg.innerText = "";
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        await set(ref(database, 'users/' + uid), {
          name: name,
          color: initialColor,
          clicks: 0
        });
      } catch (err) {
        errorMsg.innerText = err.message.replace("Firebase: ", "");
      }
    });

    // Log In User
    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        errorMsg.innerText = "";
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errorMsg.innerText = err.message.replace("Firebase: ", "");
      }
    });

    // Session Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        userProfileRef = ref(database, 'users/' + user.uid);

        const snapshot = await get(userProfileRef);
        if (snapshot.exists()) {
          const profile = snapshot.val();
          localPlayer.name = profile.name || "Player";
          localPlayer.color = profile.color || "#4CAF50";
          localPlayer.clicks = profile.clicks || 0;
        }

        authOverlay.style.display = 'none';
        
        liveColorPicker.value = localPlayer.color;
        clickBtn.style.backgroundColor = localPlayer.color;
        document.documentElement.style.setProperty('--glow-color', `${localPlayer.color}66`);
        clickBtn.innerText = localPlayer.clicks;
      }
    });

    // Global listener for ALL accounts
    onValue(allUsersRef, (snapshot) => {
      const users = snapshot.val() || {};
      
      const sortedUsers = Object.keys(users).map(id => ({
        id: id,
        name: users[id].name || "Player",
        color: users[id].color || "#4CAF50",
        clicks: users[id].clicks || 0
      })).sort((a, b) => b.clicks - a.clicks);

      leaderboardList.innerHTML = "";
      const top10 = sortedUsers.slice(0, 10);
      let inTop10 = false;

      top10.forEach((player, index) => {
        if (currentUser && player.id === currentUser.uid) {
          inTop10 = true;
        }

        const li = document.createElement('li');
        li.className = 'leaderboard-item';
        li.innerHTML = `
          <div class="player-info">
            <span class="rank">#${index + 1}</span>
            <span class="color-dot" style="background-color: ${player.color}"></span>
            <span>${player.name}</span>
          </div>
          <span class="score">${player.clicks}</span>
        `;
        leaderboardList.appendChild(li);
      });

      if (currentUser && !inTop10) {
        const myRankIndex = sortedUsers.findIndex(player => player.id === currentUser.uid);
        if (myRankIndex !== -1) {
          myRankDisplay.style.display = 'block';
          myRankDisplay.innerText = `Your Rank: #${myRankIndex + 1} of ${sortedUsers.length}`;
        }
      } else {
        myRankDisplay.style.display = 'none';
      }
    });

    // Handle Click
    clickBtn.addEventListener('click', () => {
      if (!currentUser || !userProfileRef) return;

      localPlayer.clicks++;
      clickBtn.innerText = localPlayer.clicks;

      update(userProfileRef, { clicks: localPlayer.clicks });
    });
  </script>
</body>
</html>
